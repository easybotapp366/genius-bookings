name = "genius-bookings"
main = "src/worker.js"
compatibility_date = "2026-10-09"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Cloudflare D1 database binding for the production Genius Bookings instance.
[[d1_databases]]
binding = "DB"
database_name = "genius-bookings-db"
database_id = "e1bb420c-48a3-4c69-8d0d-b4dea1297c68"
migrations_dir = "migrations"
