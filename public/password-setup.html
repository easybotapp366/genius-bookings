<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>تجهيز كلمة مرور الإدارة — Genius Bookings</title>
<style>body{font:17px system-ui;background:#f4f6fa;color:#17243d;display:grid;place-items:center;min-height:100vh;margin:0}main{background:#fff;border-radius:16px;padding:24px;max-width:560px;margin:16px;border:1px solid #dfe5f0;width:min(560px,90vw)}label{display:block;margin-top:16px}input,textarea,button{box-sizing:border-box;width:100%;font:inherit;border-radius:9px;padding:12px;border:1px solid #b9c5d7;margin-top:8px}button{background:#1f55b6;color:white;cursor:pointer;border:0;font-weight:700}textarea{direction:ltr;resize:vertical}small{display:block;color:#64748b;margin:12px 0}#result[hidden]{display:none}#notice{color:#9b2733}</style>
<script src="./password-setup.js" defer></script>
</head>
<body><main>
<h1>🔐 إعداد كلمة مرور Genius Bookings</h1>
<p>دي أداة محلية داخل المتصفح لتجهيز قيمة <code>ADMIN_PASSWORD_HASH</code> المطلوبة في Cloudflare.</p>
<form id="hash-form" autocomplete="off">
<label>كلمة مرور قوية (14 حرفًا على الأقل)<input id="password" type="password" minlength="14" autocomplete="new-password" required></label>
<label>تأكيد كلمة المرور<input id="confirm" type="password" minlength="14" autocomplete="new-password" required></label>
<button id="generate" type="submit">توليد القيمة الآمنة</button>
</form>
<p id="notice" role="status" aria-live="polite"></p>
<div id="result" hidden>
<label>انسخ القيمة كاملة إلى Cloudflare Secret باسم <code>ADMIN_PASSWORD_HASH</code><textarea id="hash" readonly rows="4" spellcheck="false"></textarea></label>
<button id="copy" type="button">نسخ قيمة الإعداد</button>
</div>
<small>كلمة المرور وقيمتها المشفّرة لا تُرسَل لأي سيرفر بواسطة هذه الصفحة، ولا تُحفظ في التخزين المحلي. احتفظ بكلمة المرور لنفسك فقط، ولا ترسلها في المحادثة أو ترفعها على GitHub.</small>
</main></body></html>
